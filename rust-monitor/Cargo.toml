[package]
name = "solana-monitor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "monitor"
path = "src/main.rs"

[dependencies]
# Solana Core
solana-client = "1.18"
solana-sdk = "1.18"
solana-program = "1.18"

# Async Runtime
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = "0.21"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP Client
reqwest = { version = "0.11", features = ["json"] }

# WebSocket Server
ws = "0.14"
uuid = { version = "1.6", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Data Processing
rayon = "1.7"
parking_lot = "0.12"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Environment
dotenv = "0.15"

# Caching
lru = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
